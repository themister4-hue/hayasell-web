services:
  - type: web
    name: hayasell-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hayasell-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hayasell-redis
          property: connectionString

  - type: keyvalue
    name: hayasell-redis
    plan: free
    ipAllowList: []

databases:
  - name: hayasell-db
    plan: free
