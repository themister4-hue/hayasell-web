name: hayasell

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hayasell
      POSTGRES_PASSWORD: hayasell_dev
      POSTGRES_DB: hayasell_dev
    ports:
      - "5432:5432"
    volumes:
      - hayasell_pg:/var/lib/postgresql/data
    networks:
      - hayasell_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - hayasell_net

volumes:
  hayasell_pg:

networks:
  hayasell_net:
    name: hayasell_net
